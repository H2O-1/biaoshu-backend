spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "jdbc:h2:mem:bidding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

bidding:
  jwt:
    # 仅 local 使用；生产必须用 JWT_SECRET 环境变量
    secret: "local-dev-only-jwt-secret-32bytes-xx"
  bootstrap-admin:
    enabled: true
    username: admin
    password: "${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe@123}"
    display-name: 平台管理员
  storage:
    type: memory
  # local 为单进程调试：API 进程内同时开启任务 Poller；
  # 生产部署由独立 bidding-worker 进程执行，API 保持默认关闭。
  index:
    worker-enabled: true
  checklist:
    worker-enabled: true
  review:
    worker-enabled: true
  tender-analysis:
    worker-enabled: true
  bid-simulation-audit:
    worker-enabled: true
  ai-review-pipeline:
    worker-enabled: true
  expert-review:
    deadline-worker-enabled: true
