server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bidding-api
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/bidding}"
    username: ${DB_USER:bidding}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

bidding:
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: ${JWT_EXPIRE_SECONDS:28800}
  bootstrap-admin:
    enabled: true
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: 平台管理员

logging:
  level:
    root: INFO
    com.bidding: INFO
