spring:
  datasource:
    # 可用环境变量 / .env 覆盖；默认值保留本地 historical bidding_dev
    url: "${DB_URL:jdbc:postgresql://localhost:5432/bidding_dev}"
    username: ${DB_USER:bidding}
    password: ${DB_PASSWORD:bidding123}

bidding:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-at-least-32-bytes}
  bootstrap-admin:
    enabled: true
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe@123}
    display-name: 平台管理员
  storage:
    type: ${STORAGE_TYPE:s3}
    s3:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:bidding-dev}
      region: ${MINIO_REGION:us-east-1}